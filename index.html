<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行政業務協調系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/pixel-style.css">
</head>

<body class="h-screen overflow-hidden relative">

    <div id="global-loader" class="absolute inset-0 z-50 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p>連線中...</p>
    </div>

    <div id="sys-modal"
        class="fixed inset-0 z-[60] bg-black bg-opacity-60 hidden-section flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm p-6">
            <div class="text-center mb-4"><span class="text-4xl">!</span></div>
            <h3 id="modal-title" class="text-center text-xl font-bold mb-4"
                style="font-family: 'Press Start 2P', cursive; font-size: 12px;">提示</h3>
            <p id="modal-message" class="text-center mb-6" style="font-family: 'VT323', monospace; font-size: 20px;">
                訊息內容...</p>
            <div class="flex gap-3 justify-center">
                <button id="modal-btn-cancel" class="pixel-btn pixel-btn-secondary hidden-section">取消</button>
                <button id="modal-btn-confirm" class="pixel-btn">確定</button>
            </div>
        </div>
    </div>

    <div id="auth-container" class="hidden-section">
        <div id="login-card" class="pixel-card">
            <div class="login-icon" style="animation: bounce 2s infinite;">G</div>
            <h2 class="login-title">行政業務協調系統</h2>
            <p class="login-subtitle">歡迎回來，請登入</p>

            <form id="login-form" onsubmit="handleAppLogin(event)">
                <div class="mb-4">
                    <label class="pixel-label">帳號</label>
                    <input type="text" id="login-username" required class="pixel-input" placeholder=">>> 輸入您的帳號"
                        autocomplete="username">
                </div>
                <div class="mb-6">
                    <label class="pixel-label">密碼</label>
                    <input type="password" id="login-password" required class="pixel-input" placeholder=">>> 輸入您的密碼"
                        autocomplete="current-password">
                </div>
                <button type="submit" id="btn-login" class="pixel-btn w-full mb-4">開始</button>
            </form>

            <div class="text-center mb-4">
                <button type="button" onclick="toggleAuthMode('register')"
                    style="font-family: 'VT323', monospace; font-size: 20px; color: #fd79a8; background: none; border: none; cursor: pointer;">
                    新用戶？點此註冊
                </button>
            </div>

            <div class="flex items-center my-4">
                <div class="flex-1 border-t-4" style="border-color: #dfe6e9; border-style: dotted;"></div>
                <span class="px-4 text-gray-500" style="font-family: 'VT323', monospace; font-size: 20px;">或</span>
                <div class="flex-1 border-t-4" style="border-color: #dfe6e9; border-style: dotted;"></div>
            </div>

            <button type="button" onclick="handleGoogleLogin()" id="btn-google-login"
                class="pixel-btn pixel-btn-google w-full">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                使用 Google 登入
            </button>
        </div>

        <div id="register-card" class="pixel-card hidden-section">
            <div class="login-icon">+</div>
            <h2 class="login-title">建立帳號</h2>
            <p class="login-subtitle">請填寫您的資料</p>

            <form id="register-form" onsubmit="handleAppRegister(event)">
                <div class="mb-3">
                    <label class="pixel-label">職稱</label>
                    <input type="text" id="reg-jobTitle" required class="pixel-input" placeholder="例如：教導主任">
                </div>
                <div class="mb-3">
                    <label class="pixel-label">姓名</label>
                    <input type="text" id="reg-name" required class="pixel-input" placeholder="您的姓名">
                </div>
                <div class="mb-3">
                    <label class="pixel-label">帳號</label>
                    <input type="text" id="reg-username" required class="pixel-input" placeholder="用於登入"
                        autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="pixel-label">密碼</label>
                    <input type="password" id="reg-password" required class="pixel-input" placeholder="設定密碼"
                        autocomplete="new-password">
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="toggleAuthMode('login')"
                        class="pixel-btn pixel-btn-secondary flex-1">返回</button>
                    <button type="submit" id="btn-register" class="pixel-btn pixel-btn-success flex-1">建立</button>
                </div>
            </form>
        </div>
    </div>

    <div id="main-app" class="hidden-section flex h-screen">
        <aside class="w-64 flex flex-col">
            <div class="p-4 border-b border-gray-700 flex items-center gap-3">
                <div class="sidebar-avatar" id="sidebar-avatar">?</div>
                <div>
                    <h3 class="font-bold text-white text-sm" id="sidebar-name"
                        style="font-family: 'VT323', monospace; font-size: 18px;">載入中...</h3>
                    <p class="text-gray-400 text-xs" id="sidebar-job" style="font-family: 'VT323', monospace;">...</p>
                </div>
            </div>

            <nav class="flex-1 p-3 space-y-2">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full active"><i class="fas fa-gamepad"></i>
                    主頁面</button>
                <button onclick="switchTab('account')" class="nav-btn w-full"><i class="fas fa-user-cog"></i>
                    帳號設定</button>
                <button onclick="switchTab('notifications')" class="nav-btn w-full relative"><i class="fas fa-bell"></i>
                    通知
                    <span id="notif-badge"
                        class="hidden absolute right-2 top-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center"
                        style="font-family: 'Press Start 2P', cursive; font-size: 8px;">0</span>
                </button>
                <button onclick="switchTab('editor')" class="nav-btn w-full"><i class="fas fa-calendar-plus"></i>
                    新增行程</button>
            </nav>

            <div class="p-3 border-t border-gray-700">
                <button onclick="appLogout()" class="nav-btn w-full text-red-400 hover:text-red-300"><i
                        class="fas fa-sign-out-alt"></i> 登出</button>
            </div>
        </aside>

        <main class="flex-1 overflow-hidden flex flex-col">
            <header class="p-4 flex justify-between items-center">
                <h1 id="page-title">主頁面</h1>
                <div class="text-sm" id="current-date" style="font-family: 'VT323', monospace; font-size: 18px;"></div>
            </header>

            <div class="flex-1 overflow-y-auto p-6" id="content-area">
                <div id="view-dashboard" class="h-full flex flex-col gap-6">
                    <div class="content-card flex-1 p-4 overflow-hidden flex flex-col">
                        <h2>最新公告</h2>
                        <div id="announcement-list" class="flex-1 overflow-y-auto space-y-3">
                            <p class="text-gray-400 text-center py-4">載入中...</p>
                        </div>
                    </div>
                    <div class="content-card flex-1 p-4 overflow-hidden flex flex-col">
                        <h2>重要行事</h2>
                        <div id="important-events-list" class="flex-1 overflow-y-auto space-y-2">
                            <p class="text-gray-400 text-center py-4">載入中...</p>
                        </div>
                    </div>
                </div>

                <div id="view-account" class="hidden-section max-w-2xl mx-auto">
                    <div class="content-card p-8">
                        <h2>修改個人資料</h2>
                        <form onsubmit="handleUpdateProfile(event)">
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div><label class="pixel-label">職稱</label><input type="text" id="edit-jobTitle"
                                        class="pixel-input"></div>
                                <div><label class="pixel-label">姓名</label><input type="text" id="edit-name"
                                        class="pixel-input"></div>
                            </div>
                            <div class="mb-4"><label class="pixel-label">帳號（不可修改）</label><input type="text"
                                    id="edit-username" disabled class="pixel-input opacity-50"></div>
                            <div class="mb-6"><label class="pixel-label">新密碼</label><input type="password"
                                    id="edit-password" class="pixel-input" placeholder="不修改請留空"
                                    autocomplete="new-password"></div>
                            <button type="submit" class="pixel-btn pixel-btn-success">儲存變更</button>
                        </form>
                    </div>
                </div>

                <div id="view-notifications" class="hidden-section max-w-4xl mx-auto">
                    <div class="content-card p-6 mb-4">
                        <h2>待辦事項與通知</h2>
                        <p class="text-sm text-gray-500 mb-4 bg-gray-100 p-2" style="font-family: 'VT323', monospace;">
                            提示：點擊「完成」可移除已完成的事項</p>
                        <div id="notification-list" class="space-y-4"></div>
                    </div>
                </div>

                <div id="view-editor" class="hidden-section max-w-3xl mx-auto">
                    <div class="content-card p-8">
                        <h2>新增行程</h2>
                        <form onsubmit="handleFirebaseAddEvent(event)">
                            <div class="mb-4"><label class="pixel-label">項目名稱</label><input type="text" id="evt-title"
                                    required class="pixel-input" placeholder="例如：期中考務會議"></div>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div><label class="pixel-label">日期</label><input type="date" id="evt-date" required
                                        class="pixel-input"></div>
                                <div><label class="pixel-label">時間</label><input type="time" id="evt-time" required
                                        class="pixel-input"></div>
                            </div>
                            <div class="mb-4">
                                <label class="pixel-label">通知人員</label>
                                <div id="selected-targets-container"
                                    class="flex flex-wrap gap-2 mb-2 p-2 border-2 border-dashed min-h-[46px] bg-white items-center"
                                    style="font-family: 'VT323', monospace;"><span
                                        class="text-gray-400">尚未選擇人員...</span></div>
                                <div class="border-2 h-48 overflow-y-auto bg-gray-50 p-2 space-y-1"
                                    id="target-selection-list">
                                    <div class="text-gray-400 text-sm p-2">載入中...</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 mb-6"
                                style="font-family: 'VT323', monospace; font-size: 18px;"><input type="checkbox"
                                    id="evt-is-public" class="w-5 h-5"><label for="evt-is-public">設為重要行事</label></div>
                            <button type="submit" id="btn-add-event"
                                class="pixel-btn pixel-btn-success w-full">新增行程</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').then(r=>console.log('[SW] Registered')).catch(e=>console.log('[SW] Failed',e));});}</script></body>

</html>
