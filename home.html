<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行政業務協調系統 - 學校行政管理平台</title>
    <meta name="description" content="行政業務協調系統是一個專為學校行政人員設計的內部協調工具，提供行程管理、通知提醒、業務協調等功能。">
    <link rel="stylesheet" href="css/pixel-style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'VT323', monospace;
        }

        .landing-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .hero {
            background: white;
            padding: 40px;
            border: 4px solid #2d3436;
            box-shadow: 6px 6px 0 #2d3436;
            text-align: center;
            margin-bottom: 20px;
        }

        .hero-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: 'VT323', monospace;
            font-size: 48px;
            color: #6c5ce7;
            margin: 0 0 10px;
        }

        .hero-subtitle {
            font-size: 28px;
            color: #fd79a8;
            margin-bottom: 20px;
        }

        .hero-desc {
            font-size: 22px;
            color: #2d3436;
            line-height: 1.6;
            max-width: 700px;
            margin: 0 auto 30px;
        }

        .cta-btn {
            display: inline-block;
            font-size: 24px;
            padding: 16px 40px;
            background: #6c5ce7;
            color: white;
            border: 4px solid #2d3436;
            box-shadow: 4px 4px 0 #2d3436;
            text-decoration: none;
            transition: all 0.1s;
        }

        .cta-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #2d3436;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .feature-card {
            background: white;
            padding: 24px;
            border: 4px solid #2d3436;
            box-shadow: 4px 4px 0 #2d3436;
            text-align: center;
        }

        .feature-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .feature-title {
            font-size: 24px;
            color: #6c5ce7;
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 18px;
            color: #636e72;
        }

        .footer {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border: 4px solid #2d3436;
            text-align: center;
        }

        .footer-links {
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #6c5ce7;
            text-decoration: none;
            font-size: 20px;
            margin: 0 15px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-copy {
            font-size: 16px;
            color: #636e72;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 32px;
            }

            .hero-subtitle {
                font-size: 22px;
            }

            .hero-desc {
                font-size: 18px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="landing-container">
        <!-- Hero Section -->
        <div class="hero">
            <div class="hero-icon">🎮</div>
            <h1>行政業務協調系統</h1>
            <p class="hero-subtitle">學校行政管理平台</p>
            <p class="hero-desc">
                專為學校行政人員設計的內部協調工具。提供行程管理、跨處室協調、
                通知提醒、共用日曆等功能，讓學校行政業務更有效率。
            </p>
            <a href="index.html" class="cta-btn">🚀 進入系統</a>
        </div>

        <!-- Features Section -->
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">📅</div>
                <div class="feature-title">行程管理</div>
                <div class="feature-desc">建立、編輯和追蹤學校行政活動與會議</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🔔</div>
                <div class="feature-title">通知提醒</div>
                <div class="feature-desc">即時接收任務指派和重要事項通知</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🏢</div>
                <div class="feature-title">處室協調</div>
                <div class="feature-desc">跨教務處、學務處、總務處、輔導室的業務協調</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📆</div>
                <div class="feature-title">共用日曆</div>
                <div class="feature-desc">全校行事曆，一目瞭然各處室活動</div>
            </div>
        </div>

        <!-- Footer with Legal Links -->
        <div class="footer">
            <div class="footer-links">
                <a href="privacy.html">🔒 隱私權政策</a>
                <a href="terms.html">📜 服務條款</a>
                <a href="index.html">🏠 進入系統</a>
            </div>
            <p class="footer-copy">© 2026 行政業務協調系統. 學校內部使用.</p>
        </div>
    </div>
</body>

</html>
